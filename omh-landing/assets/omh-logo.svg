<?xml version="1.0" encoding="UTF-8"?>
<svg width="200" height="60" viewBox="0 0 200 60" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle for medical cross -->
  <circle cx="30" cy="30" r="25" fill="#2563EB" stroke="#1E40AF" stroke-width="2"/>

  <!-- Medical cross -->
  <rect x="26" y="18" width="8" height="24" rx="2" fill="white"/>
  <rect x="18" y="26" width="24" height="8" rx="2" fill="white"/>

  <!-- OMH Text -->
  <text x="70" y="25" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#1F2937">
    OMH
  </text>

  <!-- One Medical Hub subtitle -->
  <text x="70" y="40" font-family="Arial, sans-serif" font-size="10" fill="#6B7280">
    One Medical Hub
  </text>

  <!-- Healthcare tagline -->
  <text x="70" y="52" font-family="Arial, sans-serif" font-size="8" fill="#9CA3AF">
    Your Health, Our Priority
  </text>

  <!-- Decorative pulse effect -->
  <circle cx="30" cy="30" r="28" fill="none" stroke="#60A5FA" stroke-width="1" opacity="0.3">
    <animate attributeName="r" values="28;32;28" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.3;0.1;0.3" dur="2s" repeatCount="indefinite"/>
  </circle>

  <!-- Small medical icons -->
  <g transform="translate(160, 15)">
    <!-- Stethoscope icon -->
    <path d="M8 2C8 0.9 8.9 0 10 0S12 0.9 12 2V8C12 11.3 9.3 14 6 14H4C1.8 14 0 12.2 0 10S1.8 6 4 6H6C7.1 6 8 6.9 8 8V2Z" fill="#10B981" opacity="0.7"/>
    <circle cx="4" cy="10" r="2" fill="#10B981"/>
    <circle cx="16" cy="10" r="2" fill="#10B981"/>
  </g>

  <!-- Heart rate line -->
  <g transform="translate(160, 35)">
    <path d="M0 5 L5 5 L7 0 L10 10 L13 0 L15 5 L20 5" stroke="#EF4444" stroke-width="2" fill="none" opacity="0.6"/>
  </g>
</svg>